<!DOCTYPE html>
<html lang="en" data-pp-form-factor="native">
  <head>
    <meta charset="utf-8" />
    <title>Jobs — pro app nav</title>
    <!-- Each nav concept is a folder of its own; the root opens the first and
         the control under every concept page's frame switches between them. -->
    <script>
      // Carries ?speed= and the like across; the meta refresh below is the
      // fallback without script.
      window.location.replace('routing/' + window.location.search);
    </script>
    <meta http-equiv="refresh" content="0; url=routing/" />
  </head>
  <body>
    <p><a href="routing/">Routing</a></p>
  </body>
</html>
